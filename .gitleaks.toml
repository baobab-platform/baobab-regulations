title = "Baobab Regulations Gitleaks policy"

[extend]
useDefault = true

[[allowlists]]
description = "The detector policy itself contains detection-pattern examples."
paths = ['''^\.gitleaks\.toml$''']

[[allowlists]]
description = "R-CAP-09 deterministic test command keys are non-secret idempotency fixtures."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^tests/unit/test_decision_evaluation\.py$''']
regexes = [
  '''(?i)\bidempotency_key\s*=\s*["']r-cap-09-decision-000[12]["']'''
]
