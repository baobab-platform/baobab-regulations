    state: BLOCKED
    evidence: null
    explanation: Regulatory legal-basis and golden-case certification are not evidenced by a test BRIR fixture.
  signed_policy_bundle_and_trust:
    owner: infrastructure
    state: BLOCKED
    evidence: null
    explanation: No signed production bundle promotion, trust root or deployment acceptance evidence.
  resource_server_authentication:
    owner: baobab-iam
    state: BLOCKED
    evidence: null
    explanation: No independently accepted production baobab-regulations audience verifier deployment.
  identity_and_audience_allocation:
    owner: baobab-iam
    state: BLOCKED
    evidence: null
    explanation: Workload/validator registration and caller audience grants are not established.
  invocation_authorization:
    owner: baobab-cp
    state: BLOCKED
    evidence: null
    explanation: Caller-bound context redemption alone is not capability resolution/grant proof.
  event_transport_binding:
