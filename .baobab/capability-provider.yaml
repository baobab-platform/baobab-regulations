# .baobab/capability-provider.yaml
#
# Baobab Capability Provider Declaration for baobab-regulations
#
# Conforms to:
#   baobab-platform/shared/contracts/capability/v1/provider-declaration.schema.json
# Governing decisions:
#   ADR-SHARED-017 (EA-02), ADR-REG-0002, ADR-REG-0026
#
# Answers ONE question: which canonical Baobab domain capabilities do this
# engine's CapabilityProviders implement, or formally plan to implement?
#
# Authority:
#   - Shared catalogue.yaml defines which capabilities exist.
#   - This file only references or proposes keys; it never defines semantics.
#   - Control Plane owns activation, bindings, grants, health, resolution.
#   - EA-09 owns certification (no certified field here).
#
# Catalogue status (2026-10-06):
#   ADR-SHARED-027 completes the first Regulations capability census.
#   Two narrow RTD-06 capabilities are canonical and remain DRAFT:
#     regulations.requirement.resolve
#     regulations.evidence.assess
#   R-CAP-01 and R-CAP-02 implement provider-neutral application adapters.
#   R-CAP-04 adds the exact authenticated/context-bound HTTP routes and
#   Control Plane caller-bound context-validation adapter. R-CAP-05 adds
#   durable PostgreSQL assessment snapshots, concurrency-safe tenant-scoped
#   idempotency and RLS. Event outbox publication, validator workload
#   activation and provider promotion remain later/cross-repository gates.
#   Both capabilities therefore remain capability_key + CONTRACTED only.
#   The broader Regulations capabilities remain proposed_key + PROPOSED.
#   No providers[].support entry is justified yet.
#
# Validate (with a Shared checkout):
#   python3 <shared>/scripts/capability_catalogue.py validate-declaration \
#     .baobab/capability-provider.yaml --engine-id baobab-regulations --repository-root .

schema:
  name: baobab-capability-provider-declaration
  version: "1.0"

engine:
  # Repository name as engine identity (ADR-SHARED-012).
  engine_id: baobab-regulations

# No providers[] yet. R-CAP-01/R-CAP-02/R-CAP-04/R-CAP-05 now cover the
# canonical application adapters, authenticated/context-bound HTTP surface and
# durable command state. Outbox publication, the Shared/IAM baobab-regulations
# validator workload allocation, and provider-readiness promotion remain
# governed gates. Implementation evidence is not activation.

planned_capabilities:
  - capability_key: regulations.evidence.assess
    proposal_status: CONTRACTED
    description: >-
      Assess bounded Trade Docs documentary facts against one pinned
      Regulations requirement using the canonical RTD-06 Shared contract.
      R-CAP-02 adapter, R-CAP-04 authenticated route and R-CAP-05 durable assessment/idempotency store implemented; no provider support is claimed yet.
    provenance:
      authority:
        repository: baobab-platform/shared
        decision: ADR-SHARED-027

  - capability_key: regulations.requirement.resolve
    proposal_status: CONTRACTED
    description: >-
      Resolve one exact pinned Regulations-owned documentary, permit or
      evidence requirement projection using the canonical RTD-06 Shared
      contract. R-CAP-01 adapter and R-CAP-04 authenticated route implemented; no provider support is claimed yet.
    provenance:
      authority:
        repository: baobab-platform/shared
        decision: ADR-SHARED-027

  - proposed_key: regulations.context.resolve
    proposal_status: PROPOSED
    description: >-
      Resolve regulatory applicability context (jurisdiction roles, regimes,
      HS, legal/knowledge time) from an opaque platform context reference
      without Regulations owning tenant, organisation, legal entity, market,
      or trade-lane truth (ADR-REG-0017, ADR-REG-0026).
    provenance:
      authority:
        repository: baobab-platform/baobab-regulations
        decision: ADR-REG-0017

  - proposed_key: regulations.decision.evaluate
    proposal_status: PROPOSED
    description: >-
      Produce a deterministic RegulatoryDecision (outcome, enforcement class,
      reasons, recommended disposition) for a verified rule set. PDP only —
      operational enforcement remains with domain PEPs (ADR-REG-0018, ADR-REG-0019).
    provenance:
      authority:
        repository: baobab-platform/baobab-regulations
        decision: ADR-REG-0018

  - proposed_key: regulations.change.subscribe
    proposal_status: PROPOSED
    description: >-
      Subscribe to regulatory change and impact notifications for activated
      coverage profiles (ADR-REG-0023, ADR-REG-0024). Not implemented until REG-10.
    provenance:
      authority:
        repository: baobab-platform/baobab-regulations
        decision: ADR-REG-0024

  - proposed_key: regulations.pack.compose
    proposal_status: PROPOSED
    description: >-
      Compose jurisdiction / corridor / regime packs and coverage manifests from
      already-verified regulatory modules without altering regulatory truth
      (ADR-REG-0029). Not implemented until REG-11.
    provenance:
      authority:
        repository: baobab-platform/baobab-regulations
        decision: ADR-REG-0029
