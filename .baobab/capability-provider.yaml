# .baobab/capability-provider.yaml
#
# Baobab Capability Provider Declaration for baobab-regulations
#
# Conforms to:
#   baobab-platform/shared/contracts/capability/v1/provider-declaration.schema.json
# Governing decisions:
#   ADR-SHARED-017 (EA-02), ADR-SHARED-027, ADR-SHARED-028,
#   ADR-REG-0031, ADR-REG-0032, ADR-REG-0033, ADR-REG-0034
#
# Answers ONE question: which canonical Baobab domain capabilities do this
# engine's CapabilityProviders implement, or formally plan to implement?
#
# Authority:
#   - Shared catalogue.yaml defines which capabilities exist.
#   - This file only references or proposes keys; it never defines semantics.
#   - Control Plane owns activation, bindings, grants, health, resolution.
#   - EA-09 owns certification (no certified field here).
#
# R-CAP-07 status (2026-10-06):
#   ADR-SHARED-027 catalogues the two narrow RTD-06 capabilities:
#     regulations.requirement.resolve
#     regulations.evidence.assess
#
#   R-CAP-01 through R-CAP-06 now cover the exact provider-neutral adapters,
#   authenticated/context-bound routes, Shared contract tests, durable
#   assessment/idempotency state and the canonical requirement-satisfaction
#   event outbox.
#
#   ADR-REG-0031 explicitly defines R-CAP-07 as the point at which PARTIAL
#   provider support may be declared once all canonical contract paths are
#   represented. That threshold is now satisfied.
#
#   PARTIAL is deliberate. R-CAP-10 adds durable exact requirement projections,
#   but governed source-backed ingestion/promotion, a production workload-token
#   authenticator, deployment binding for the event publisher, EA-09
#   certification, and the Shared/IAM
#   baobab-regulations validator workload required for context:validate.
#   Therefore IMPLEMENTED and runtime activation would still be overclaims.
#
# Validate (with a Shared checkout):
#   python3 <shared>/scripts/capability_catalogue.py validate-declaration \
#     .baobab/capability-provider.yaml --engine-id baobab-regulations --repository-root .

schema:
  name: baobab-capability-provider-declaration
  version: "1.0"

engine:
  # Repository name as engine identity (ADR-SHARED-012).
  engine_id: baobab-regulations

providers:
  - provider_key: baobab-regulations.core
    name: Baobab Regulations core provider
    description: >-
      First-party provider for canonical Regulations documentary and
      deterministic decision capabilities. Repository implementation is partial
      and intentionally not
      activation evidence. The provider is eligible to pursue production
      certification, but is not currently certified, registered active, bound,
      granted or runtime-resolvable through the Control Plane.
    provider_type: BAOBAB_ENGINE
    implementation_key: core
    simulated: false
    # This means the provider family may eventually be promoted to production;
    # it does NOT mean the current PARTIAL support is production-ready or active.
    production_permitted: true
    provenance:
      authority:
        repository: baobab-platform/baobab-regulations
        decision: ADR-REG-0032
    support:
      - capability_key: regulations.decision.evaluate
        contract_versions: [1]
        implementation_status: PARTIAL
        provenance:
          authority:
            repository: baobab-platform/shared
            decision: ADR-SHARED-028
          source_revision: 1ac220728728932d560fa9edd88ec1faa32599ec
        implementation_evidence:
          - type: source
            path: src/baobab_regulations/application/services/decision_evaluation.py
            description: Canonical caller/context orchestration, bitemporal rule-set resolution, replay identity, integrity and enforcement-ceiling checks.
          - type: source
            path: src/baobab_regulations/brir/models.py
            description: Typed bounded BRIR v1 executable subset with no raw target-language escape hatch.
          - type: source
            path: src/baobab_regulations/brir/compiler.py
            description: Deterministic BRIR-to-Rego v1 compiler with semantic and artifact fingerprints.
          - type: source
            path: src/baobab_regulations/infrastructure/opa/client.py
            description: Production OPA Data API adapter with bundle readiness and undefined/protocol/runtime failure separation.
          - type: source
            path: src/baobab_regulations/infrastructure/rule_sets.py
            description: Exact pinned, bitemporal, assurance-aware and tenant-scoped rule-set authority.
          - type: source
            path: src/baobab_regulations/infrastructure/persistence/decision_idempotency_postgres.py
            description: Durable tenant-scoped command idempotency and semantic replay authority.
          - type: source
            path: migrations/000005_regulatory_decision_evaluations.sql
            description: Canonical decision snapshots, replay uniqueness and rule-set scope/RLS persistence.
          - type: source
            path: src/baobab_regulations/api/routes.py
            description: Authenticated canonical POST /decisions/evaluate route.
          - type: contract-test
            path: tests/contract/test_r_cap_08_decision_contract.py
            description: Exact Shared decision request/response contract proof retained from R-CAP-08.
          - type: test
            path: tests/unit/test_brir_compiler.py
            description: BRIR validation, deterministic compilation, applicability and target-language isolation proof.
          - type: test
            path: tests/unit/test_opa_evaluator.py
            description: OPA readiness, fingerprint, undefined, protocol and runtime failure proof.
          - type: test
            path: tests/unit/test_decision_evaluation.py
            description: Decision orchestration, replay, tenant integrity, enforcement ceiling and reference-evaluator differential proof.
          - type: test
            path: tests/unit/test_rule_set_authority.py
            description: Bitemporal, content-pin, assurance and tenant rule-set authority proof.
          - type: test
            path: tests/api/test_r_cap_09_decision_route.py
            description: Authenticated route and ProblemDetails failure-surface proof.
          - type: integration-test
            path: tests/integration/test_live_opa_decision_evaluation.py
            description: Checksum-pinned real OPA Data API execution of compiler-generated BRIR-derived Rego.
          - type: integration-test
            path: tests/integration/test_postgres_decision_evaluation.py
            description: PostgreSQL durability, semantic replay, concurrency and RLS proof.

      - capability_key: regulations.evidence.assess
        contract_versions: [1]
        implementation_status: PARTIAL
        provenance:
          authority:
            repository: baobab-platform/shared
            decision: ADR-SHARED-027
          source_revision: d99288e7f525d87b2d41f1d03245a65115606b8c
        implementation_evidence:
          - type: source
            path: src/baobab_regulations/application/services/evidence_assessment.py
            description: Exact RTD-06 assessment orchestration, tenant/reference integrity and idempotency boundary.
          - type: source
            path: src/baobab_regulations/api/routes.py
            description: Authenticated, context-bound canonical evidence-assessment HTTP operation.
          - type: source
            path: src/baobab_regulations/infrastructure/persistence/idempotency_postgres.py
            description: Durable tenant-scoped assessment and atomic event-intent commit.
          - type: source
            path: src/baobab_regulations/infrastructure/persistence/event_outbox_postgres.py
            description: Tenant-scoped canonical event outbox leasing and delivery-state persistence.
          - type: contract-test
            path: tests/contract/test_rtd06_evidence_assessment_contract.py
            description: Exact Shared RTD-06 request/result contract proof.
          - type: contract-test
            path: tests/contract/test_rtd08_requirement_satisfaction_event.py
            description: Exact Shared RTD-08 canonical event proof.
          - type: integration-test
            path: tests/integration/test_postgres_evidence_assessment_idempotency.py
            description: PostgreSQL durability, concurrency, replay and RLS proof.
          - type: integration-test
            path: tests/integration/test_postgres_event_outbox.py
            description: Transactional outbox, retry, lease, redelivery and tenant-isolation proof.

      - capability_key: regulations.requirement.resolve
        contract_versions: [1]
        implementation_status: PARTIAL
        provenance:
          authority:
            repository: baobab-platform/shared
            decision: ADR-SHARED-027
          source_revision: d99288e7f525d87b2d41f1d03245a65115606b8c
        implementation_evidence:
          - type: source
            path: src/baobab_regulations/application/services/requirement_resolution.py
            description: Exact pinned requirement-resolution application adapter and authority guards.
          - type: source
            path: src/baobab_regulations/api/routes.py
            description: Authenticated, context-bound canonical requirement-resolution HTTP operation.
          - type: source
            path: src/baobab_regulations/infrastructure/persistence/requirements_postgres.py
            description: Durable exact-pinned requirement authority with integrity checks and tenant-scoped PostgreSQL reads.
          - type: source
            path: migrations/000006_regulatory_requirement_projections.sql
            description: Immutable requirement projection persistence with historical pins, fingerprint constraints and tenant RLS.
          - type: integration-test
            path: tests/integration/test_postgres_requirement_authority.py
            description: PostgreSQL historical-pin, immutability, integrity and tenant-isolation proof.
          - type: test
            path: tests/unit/test_requirement_resolution.py
            description: Exact pinning, stale/conflict, ownership and fail-closed behavior.
          - type: contract-test
            path: tests/contract/test_rtd06_requirement_resolve_contract.py
            description: Exact Shared RTD-06 request/response contract proof.
          - type: contract-test
            path: tests/contract/test_rtd06_http_openapi.py
            description: Canonical HTTP/OpenAPI route and error-surface proof.
          - type: test
            path: tests/unit/test_control_plane_context_authority.py
            description: Caller-bound Control Plane context-validation behavior.

planned_capabilities:
  - proposed_key: regulations.context.resolve
    proposal_status: PROPOSED
    description: >-
      Resolve regulatory applicability context (jurisdiction roles, regimes,
      HS, legal/knowledge time) from an opaque platform context reference
      without Regulations owning tenant, organisation, legal entity, market,
      or trade-lane truth (ADR-REG-0017, ADR-REG-0026).
    provenance:
      authority:
        repository: baobab-platform/baobab-regulations
        decision: ADR-REG-0017

  - proposed_key: regulations.change.subscribe
    proposal_status: PROPOSED
    description: >-
      Subscribe to regulatory change and impact notifications for activated
      coverage profiles (ADR-REG-0023, ADR-REG-0024). Not implemented until REG-10.
    provenance:
      authority:
        repository: baobab-platform/baobab-regulations
        decision: ADR-REG-0024

  - proposed_key: regulations.pack.compose
    proposal_status: PROPOSED
    description: >-
      Compose jurisdiction / corridor / regime packs and coverage manifests from
      already-verified regulatory modules without altering regulatory truth
      (ADR-REG-0029). Not implemented until REG-11.
    provenance:
      authority:
        repository: baobab-platform/baobab-regulations
        decision: ADR-REG-0029
