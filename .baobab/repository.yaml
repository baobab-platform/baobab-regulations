schema_version: 1
repository:
  lifecycle: active
capabilities:
  - python
  - container
  - engine
environment:
  baobab_dev:
    required: true
    profile: full
package_managers:
  python: uv
artifacts:
  container:
    enabled: false
    dockerfile: Dockerfile
    context: .
    runtime: false
security:
  sast_provider: fallback
