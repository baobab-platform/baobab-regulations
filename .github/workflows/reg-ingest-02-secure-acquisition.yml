name: REG-INGEST-02 Secure Source Acquisition

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REG_INGEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baobab_regulations_test

jobs:
  reg-ingest-02:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baobab_regulations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baobab_regulations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout Regulations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.14
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v7.0.0+6
        with:
          python-version: "3.14"

      - name: Install REG-INGEST-02 test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check \
            "pytest>=9,<10" "pytest-asyncio>=1,<2" \
            "ruff>=0.7,<1" "mypy>=1.13,<2"

      - name: Static security and type checks
        run: |
          ruff check \
            src/baobab_regulations/domain/ingestion \
            src/baobab_regulations/application/ports/secure_acquisition.py \
            src/baobab_regulations/application/services/secure_source_acquisition.py \
            src/baobab_regulations/infrastructure/acquisition \
            src/baobab_regulations/infrastructure/persistence/acquisition_memory.py \
            src/baobab_regulations/infrastructure/persistence/acquisition_postgres.py \
            tests/unit/test_secure_source_acquisition.py \
            tests/unit/test_pinned_https_acquisition.py \
            tests/integration/test_postgres_secure_source_acquisition.py
          mypy \
            src/baobab_regulations/domain/ingestion \
            src/baobab_regulations/application/ports/secure_acquisition.py \
            src/baobab_regulations/application/services/secure_source_acquisition.py \
            src/baobab_regulations/infrastructure/acquisition \
            src/baobab_regulations/infrastructure/persistence/acquisition_memory.py \
            src/baobab_regulations/infrastructure/persistence/acquisition_postgres.py

      - name: Fail-closed acquisition and SSRF cases
        run: |
          pytest -q \
            tests/unit/test_secure_source_acquisition.py \
            tests/unit/test_pinned_https_acquisition.py

      - name: PostgreSQL 17 tenant-isolation qualification
        run: |
          pytest -q -m postgres \
            tests/integration/test_postgres_secure_source_acquisition.py
