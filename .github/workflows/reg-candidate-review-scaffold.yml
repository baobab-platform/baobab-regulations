name: REG Candidate Review Scaffold

on:
  pull_request:
    paths:
      - "src/baobab_regulations/domain/knowledge/**"
      - "src/baobab_regulations/application/services/candidate_review.py"
      - "src/baobab_regulations/infrastructure/persistence/candidate_review_memory.py"
      - "tests/unit/test_candidate_review_scaffold.py"
      - "docs/operations/adr-conformance-audit-2026-10-26.md"
      - "docs/operations/scaffold-status.md"
      - ".github/workflows/reg-candidate-review-scaffold.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-candidate-governance:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v7.0.0+6
        with:
          python-version: "3.14"
      - name: Install reproducible test tooling bounds
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check \
            "pytest>=9,<10" "pytest-asyncio>=1,<2" \
            "ruff>=0.7,<1" "mypy>=1.13,<2"
      - name: Lint and type-check governed candidate seam
        run: |
          ruff check \
            src/baobab_regulations/domain/knowledge \
            src/baobab_regulations/application/services/candidate_review.py \
            src/baobab_regulations/infrastructure/persistence/candidate_review_memory.py \
            tests/unit/test_candidate_review_scaffold.py
          mypy \
            src/baobab_regulations/domain/knowledge \
            src/baobab_regulations/application/services/candidate_review.py \
            src/baobab_regulations/infrastructure/persistence/candidate_review_memory.py
      - name: Prove candidate source and review negatives
        run: |
          pytest -q tests/unit/test_candidate_review_scaffold.py \
            tests/unit/test_source_registry.py \
            tests/architecture/test_dependency_boundaries.py
