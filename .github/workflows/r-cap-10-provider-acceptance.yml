name: R-CAP-10 Provider Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  R_CAP_10_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baobab_regulations_test

jobs:
  provider-acceptance:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baobab_regulations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baobab_regulations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout Regulations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check \
            "PyYAML==6.0.3" "pytest>=9,<10" "pytest-asyncio>=1,<2" \
            "ruff>=0.7,<1" "mypy>=1.13,<2" "types-PyYAML>=6,<7"

      - name: Lint and type-check requirement authority
        run: |
          ruff check \
            src/baobab_regulations/application/ports/requirements.py \
            src/baobab_regulations/application/services/requirement_resolution.py \
            src/baobab_regulations/infrastructure/persistence/requirements_postgres.py \
            scripts/validate_r_cap_10.py \
            tests/unit/test_r_cap_10_readiness.py \
            tests/integration/test_postgres_requirement_authority.py
          mypy \
            src/baobab_regulations/application/ports/requirements.py \
            src/baobab_regulations/application/services/requirement_resolution.py \
            src/baobab_regulations/infrastructure/persistence/requirements_postgres.py \
            scripts/validate_r_cap_10.py

      - name: Enforce non-promotable provider decision
        run: |
          python scripts/validate_r_cap_10.py --repository-root . --report /tmp/r-cap-10-readiness.json
          python -m json.tool /tmp/r-cap-10-readiness.json >/dev/null
          if python scripts/validate_r_cap_10.py --repository-root . --require-promotable \
            >/tmp/r-cap-10-promotion.out 2>/tmp/r-cap-10-promotion.err
          then
            echo "Uncertified provider unexpectedly qualified for IMPLEMENTED" >&2
            exit 1
          fi
          grep -F "promotion is BLOCKED" /tmp/r-cap-10-promotion.err

      - name: Prove evidence gate resists status forgery
        run: pytest -q tests/unit/test_r_cap_10_readiness.py

      - name: Prove exact requirement lookup semantics remain sound
        run: pytest -q tests/unit/test_requirement_resolution.py

      - name: Prove PostgreSQL append-only requirements and tenant RLS
        run: |
          pytest -q -m postgres \
            tests/integration/test_postgres_requirement_authority.py
