name: Regulations Capability Declaration Conformance

on:
  pull_request:
    paths:
      - ".baobab/capability-provider.yaml"
      - ".baobab/repository.yaml"
      - ".github/workflows/capability-conformance.yml"
  push:
    branches: [main]
    paths:
      - ".baobab/capability-provider.yaml"
      - ".baobab/repository.yaml"
      - ".github/workflows/capability-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARED_REF: 1ac220728728932d560fa9edd88ec1faa32599ec

jobs:
  capability-declaration:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Regulations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Shared capability authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          ref: ${{ env.SHARED_REF }}
          path: .shared
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6
        with:
          python-version: "3.13"

      - name: Install Shared validation runtime
        run: python -m pip install --disable-pip-version-check -r .shared/.github/foundation-tests/requirements.txt

      - name: Validate Regulations capability declaration
        run: >-
          python .shared/scripts/capability_catalogue.py
          --contracts-root .shared/contracts
          validate-declaration .baobab/capability-provider.yaml
          --engine-id baobab-regulations
          --repository-root .

      - name: Enforce repository lifecycle/provider policy
        run: >-
          python .shared/scripts/capability_catalogue.py
          check-declaration-policy
          --repository-root .
          --mode enforce
